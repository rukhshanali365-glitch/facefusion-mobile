name: FaceFusion Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      QAIRT_VERSION: "2.45.0.260326"

    steps:
      - name: Checkout v0.9.41
        uses: actions/checkout@v4
        with:
          ref: afe1467e4c50c05c401283caedd3795d9d2d88d1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android Licenses
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" --licenses

      - name: Install Android Dependencies
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Download Qualcomm QAIRT SDK
        run: |
          mkdir -p "$RUNNER_TEMP/qairt-sdk"
          URL="https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/${QAIRT_VERSION}/v${QAIRT_VERSION}.zip"
          curl -fL --retry 3 "$URL" -o "$RUNNER_TEMP/qairt.zip"
          unzip -q "$RUNNER_TEMP/qairt.zip" -d "$RUNNER_TEMP/qairt-sdk"
          HEADER=$(find "$RUNNER_TEMP/qairt-sdk" -path "*/include/QNN/QnnBackend.h" -print -quit)
          test -n "$HEADER"
          SDK_ROOT="${HEADER%/include/QNN/QnnBackend.h}"
          echo "QNN_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "QAIRT_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDK located at $SDK_ROOT"

      - name: Stage QNN Libraries
        run: |
          bash work/android/stage_qnn.sh

      - name: Build Android APK
        working-directory: work/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FaceFusion-Mobile-0.9.41
          path: work/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
