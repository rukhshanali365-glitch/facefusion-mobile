name: FaceFusion Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout v0.9.41
        uses: actions/checkout@v4
        with:
          ref: afe1467e4c50c05c401283caedd3795d9d2d88d1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Found: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Accept Android licenses
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" --licenses

      - name: Install Android dependencies
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Check Gradle
        working-directory: work/android
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Check native dependencies
        run: |
          ls -la work/android
          echo "Environment check complete"
      - name: Build Android APK
        working-directory: work/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FaceFusion-Mobile-v0.9.41
          path: work/android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
